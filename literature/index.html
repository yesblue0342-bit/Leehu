<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--gold:#b89a5c}
body{font-family:"Gowun Batang","Noto Serif KR",serif;background:var(--bg);color:var(--ink)}
.site-nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:74px;padding:0 clamp(20px,5vw,56px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.site-nav a{text-decoration:none;color:inherit}
.nav-logo{font-weight:900;font-size:1.25rem}
.nav-links{display:flex;gap:18px;list-style:none;color:#4b5563;font-size:.9rem}
main{min-height:calc(100vh - 74px);display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);border-bottom:1px solid var(--line)}
.copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,7vw,92px)}
.quote{display:flex;align-items:center;justify-content:center;background:#fafafa;border-left:1px solid var(--line);padding:clamp(36px,7vw,88px);text-align:center}
.eyebrow{font-size:1rem;letter-spacing:.34em;color:#4b5563;font-style:italic;margin-bottom:22px}
h1{font-size:clamp(2.7rem,8vw,5.6rem);line-height:1.08;margin-bottom:22px}
p{color:var(--muted);line-height:2;font-size:1.05rem;max-width:620px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.actions a{border:1px solid var(--line);border-radius:999px;padding:11px 17px;background:#fff}
.actions a.primary{background:var(--ink);border-color:var(--ink);color:#fff}
blockquote{font-size:clamp(1.5rem,3vw,2.8rem);line-height:1.55;font-style:italic}
blockquote span{display:block;color:var(--gold);font-size:1rem;margin-top:20px}
@media (max-width:800px){main{grid-template-columns:1fr}.quote{border-left:0;border-top:1px solid var(--line)}.nav-links{gap:12px;font-size:.82rem}}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-logo" href="/">이후</a>
  <ul class="nav-links">
    <li><a href="/">홈</a></li>
    <li><a href="/#board">게시판</a></li>
    <li><a href="/#contact">연락</a></li>
  </ul>
</nav>
<main>
  <section class="copy">
    <p class="eyebrow">Literature Notes</p>
    <h1>이후의 문학노트</h1>
    <p>고전 문학의 한 문장과 그 문장을 바라보는 소설가 이후의 생각을 차곡차곡 기록하는 공간입니다.</p>
    <div class="actions">
      <a class="primary" href="/">홈으로 돌아가기</a>
      <a href="/#board">방문자 게시판</a>
    </div>
  </section>
  <section class="quote">
    <blockquote>
      쓰는 것은<br>살아내는 것이다.
      <span>이후 李後</span>
    </blockquote>
  </section>
</main>
</body>
</html>
