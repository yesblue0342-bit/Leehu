<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>페이지를 찾을 수 없습니다 | 이후</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--gold:#b89a5c}
body{min-height:100vh;font-family:"Gowun Batang","Noto Serif KR",serif;color:var(--ink);background:#fff;display:grid;place-items:center;padding:32px}
main{width:min(680px,100%);text-align:center}
.eyebrow{font-size:.9rem;letter-spacing:.32em;color:var(--gold);font-style:italic;margin-bottom:18px}
h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1.1;margin-bottom:18px}
p{color:var(--muted);line-height:1.9;font-size:1.03rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
a{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:11px 17px;text-decoration:none;color:var(--ink);background:#fff}
a.primary{background:var(--ink);border-color:var(--ink);color:#fff}
a:hover{border-color:var(--gold)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Lee Hu</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 아직 공개되지 않은 페이지입니다.</p>
  <div class="actions">
    <a class="primary" href="/">홈으로 돌아가기</a>
    <a href="/literature/">문학노트</a>
    <a href="/#board">게시판</a>
  </div>
</main>
</body>
</html>
