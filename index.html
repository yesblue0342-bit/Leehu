<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1612;--paper:#f5f0e8;--ash:#8c8278;--gold:#b89a5c;--red:#8b1a1a;--blue:#3a6ea8;--line:#e6e0d7}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif KR',serif;font-weight:300;overflow-x:hidden}
button,input,textarea{font:inherit}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 360px 18px 60px;transition:background .4s,border-color .4s}
nav.scrolled{background:rgba(245,240,232,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.07)}
.nav-logo{font-size:1.3rem;font-weight:700;color:var(--paper);letter-spacing:.05em;text-decoration:none;transition:color .4s}
nav.scrolled .nav-logo{color:var(--ink)}
.nav-links{display:flex;gap:24px;list-style:none;align-items:center}
.nav-links a{font-size:.72rem;letter-spacing:.12em;color:rgba(245,240,232,.85);text-decoration:none;transition:color .3s;white-space:nowrap}
nav.scrolled .nav-links a{color:var(--ink)}
.nav-links a:hover{color:var(--gold)}

.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:80px 60px 80px 80px}
.hero-eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;letter-spacing:.2em;color:var(--ash);margin-bottom:24px;opacity:0;animation:fadeUp 1s .2s forwards}
.hero-name-kr{font-size:clamp(4rem,8vw,7rem);font-weight:700;line-height:1;opacity:0;animation:fadeUp 1s .4s forwards}
.hero-name-cn{font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,2vw,1.6rem);font-weight:300;color:var(--blue);letter-spacing:.3em;margin-top:8px;opacity:0;animation:fadeUp 1s .6s forwards}
.hero-divider{width:60px;height:1px;background:var(--gold);margin:32px 0;opacity:0;animation:fadeUp 1s .8s forwards}
.hero-tagline{font-size:1rem;line-height:2;color:var(--ash);max-width:380px;opacity:0;animation:fadeUp 1s 1s forwards}
.hero-roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px;opacity:0;animation:fadeUp 1s 1.2s forwards}
.role-tag{font-size:.72rem;letter-spacing:.14em;padding:7px 14px;border:1px solid var(--gold);color:var(--gold)}
.hero-right{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-right::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#2a1f0e,#1a1612 60%,#0d0d0d)}
.hero-kanji{font-family:'Cormorant Garamond',serif;font-size:clamp(8rem,16vw,14rem);font-weight:300;color:rgba(255,255,255,.06);position:absolute;user-select:none;opacity:0;animation:fadeIn 2s 1.5s forwards}
.hero-quote{position:relative;z-index:2;padding:60px 50px;text-align:center;opacity:0;animation:fadeUp 1.2s 1s forwards}
.hero-quote blockquote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,2.5vw,2rem);line-height:1.7;font-weight:300;color:rgba(245,240,232,.9)}
.hero-quote cite{display:block;margin-top:24px;font-size:.75rem;letter-spacing:.2em;color:var(--gold);font-style:normal}

.sec{padding:80px;max-width:1200px;margin:0 auto}
.sec-dark{background:var(--ink);padding:80px;max-width:100%}
.sec-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.9rem;letter-spacing:.25em;color:var(--red);text-transform:uppercase;margin-bottom:40px;display:flex;align-items:center;gap:16px}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--gold),transparent);max-width:200px}
.sec-dark .sec-label{color:var(--gold)}
.sec-dark .sec-label::after{background:linear-gradient(to right,rgba(184,154,92,.4),transparent)}

.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.about-text h2{font-size:clamp(2rem,3vw,2.8rem);font-weight:700;line-height:1.2;margin-bottom:28px}
.about-text p{line-height:2.2;color:#3d3530;font-size:.95rem;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ink)}
.stat-box{background:var(--paper);padding:24px;transition:background .3s}
.stat-box:hover{background:#ede8dc}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:600;line-height:1}
.stat-lbl{font-size:.72rem;letter-spacing:.15em;color:var(--ash);margin-top:6px;text-transform:uppercase}

.works-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.work-card{background:#211c17;padding:28px;border-bottom:2px solid transparent;transition:border-color .3s,background .3s;display:flex;flex-direction:column}
.work-card:hover{border-color:var(--gold);background:#2a231c}
.work-cat{font-size:.63rem;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.work-title{font-size:1.05rem;font-weight:700;color:var(--paper);margin-bottom:8px;line-height:1.3}
.work-desc{font-size:.8rem;color:rgba(245,240,232,.55);line-height:1.9;margin-bottom:14px;flex:1}
.buy-links,.book-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.buy-btn,.book-btn,.yt-btn{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;letter-spacing:.08em;padding:5px 10px;border:1px solid rgba(184,154,92,.45);color:rgba(184,154,92,.9);text-decoration:none;transition:all .25s;border-radius:2px}
.buy-btn:hover,.book-btn:hover,.yt-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.id-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.id-item{border-top:2px solid var(--gold);padding-top:24px}
.id-icon{font-size:1.6rem;margin-bottom:14px}
.id-title{font-size:1rem;font-weight:700;margin-bottom:10px}
